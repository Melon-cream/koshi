[package]
name = "koshi"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Mouse-led terminal multiplexer"
license = "MIT"
repository = "https://github.com/Melon-cream/koshi"
readme = "README.md"
keywords = ["terminal", "multiplexer", "pty", "tui"]
categories = ["command-line-utilities"]
exclude = ["Dockerfile.dev", "scripts/", "tests/", ".github/"]

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
crossterm = "0.29.0"
portable-pty = "0.9.0"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
unicode-width = "0.2.3"

[[bin]]
name = "koshi"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true

