name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        env:
          # Passed as an environment variable, never interpolated into the
          # script text: a hostile tag name must not reach the shell/node
          # parser. The regex guard below narrows it to x.y.z anyway.
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "tag is not vX.Y.Z: $VERSION" >&2; exit 1; }
          notes="$(node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const re = new RegExp("^## \\[(" + version + ")\\](?:\\s*[-–—].*)?$");
            const start = lines.findIndex((l) => re.test(l.trim()));
            if (start === -1) { process.exit(2); }
            const end = lines.slice(start + 1).findIndex((l) => /^## \[/.test(l.trim()));
            const body = lines.slice(start + 1, end === -1 ? lines.length : start + 1 + end).join("\n").trim();
            process.stdout.write(body);
          ' "$VERSION")" || { echo "no changelog entry for $VERSION" >&2; exit 1; }
          {
            echo "notes<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          tag_name: ${{ github.ref_name }}
